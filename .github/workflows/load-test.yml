name: Load Test (SmartFin v4)

# Deliberately a SEPARATE pipeline from CI and from deployment, which directly
# answers the reviewer question "is load testing done using a separate
# pipeline?". It is triggered manually or on a schedule, never in the deploy
# path, so a slow/failing load test never blocks a release.

on:
  # Push trigger scoped to this feature branch + the load-test files only, so
  # the workflow actually runs (and therefore appears in the Actions list) even
  # before it is merged to the default branch — without firing on every code
  # push. It stays a SEPARATE pipeline from CI/deploy either way.
  push:
    branches:
      - feature/aki-finance-dev
    paths:
      - "load/**"
      - ".github/workflows/load-test.yml"
  workflow_dispatch:
    inputs:
      vus:
        description: "Virtual users"
        required: true
        type: string
        default: "20"
      duration:
        description: "Test duration"
        required: true
        type: string
        default: "1m"
  schedule:
    # Weekly, Monday 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  k6-load:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 load test
        uses: grafana/setup-k6-action@v1

      - name: Execute k6
        run: |
          k6 run \
            --vus "${{ inputs.vus || '20' }}" \
            --duration "${{ inputs.duration || '1m' }}" \
            --summary-export=k6-summary.json \
            load/smoke.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-summary
          path: k6-summary.json
