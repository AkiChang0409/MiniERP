name: Deploy MiniERP Personal v4 to Cloudflare

on:
  push:
    branches:
      - feature/aki-finance-dev

  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run D1 migrations before deploy"
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-minierp-personal-v4
  cancel-in-progress: false

jobs:
  deploy-personal-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: personal-v4
      url: https://smartfin-v4.wangchang0409.workers.dev

    permissions:
      contents: read

    steps:
      # ── 1. Checkout / Setup ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare worker types
        run: npm run gen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 2. Lint + Type Check ───────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Svelte type check
        run: npx svelte-kit sync && npx svelte-check --tsconfig ./tsconfig.json

      # ── 3. Architecture Boundary ──────────────────────────────────────────
      - name: Architecture boundary check
        run: npm run check:modular-boundary

      # ── 4. Tests ──────────────────────────────────────────────────────────
      - name: Unit tests
        run: npm run test

      # ── 5. Build ──────────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── 6. Secrets ────────────────────────────────────────────────────────
      # Secrets are NO LONGER synced from GitHub on every deploy. Cloudflare keeps
      # Worker secrets across deploys (`wrangler deploy` never wipes them), so each
      # environment's secrets are set ONCE, out-of-band, and owned by whoever runs
      # that environment. This keeps API keys out of the CI pipeline entirely and
      # lets the receiving company inject their own keys without repo access.
      #
      # One-time setup per environment (Cloudflare Dashboard → the Worker →
      # Settings → Variables and Secrets, OR `wrangler secret put <NAME>`).
      # See docs/SECRETS.md for the full per-worker matrix. Summary:
      #   app worker (smartfin-v4):
      #     BETTER_AUTH_SECRET, RESEND_API_KEY, OPENAI_API_KEY,
      #     ANTHROPIC_API_KEY?, OCR_SPACE_API_KEY?, LARK_VERIFICATION_TOKEN?,
      #     LARK_APP_ID?, LARK_APP_SECRET?, QC_TOKEN_SECRET?, QC_INBOX_EMAIL?
      #   document-processor worker:
      #     OPENAI_API_KEY, OCR_SPACE_API_KEY?, LARK_APP_ID?, LARK_APP_SECRET?
      #   bitable-sync worker:
      #     LARK_APP_ID?, LARK_APP_SECRET?
      # (? = optional; only needed if that integration is enabled.)

      # ── 7. D1 Migrations ──────────────────────────────────────────────────
      - name: Run personal v4 migrations
        if: ${{ github.event_name == 'push' || inputs.run_migrations == true }}
        run: npx wrangler d1 migrations apply smartfin-db-v4 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 8. Deploy Workers ─────────────────────────────────────────────────
      - name: Deploy document processor
        run: npx wrangler deploy --config workers/wrangler.document-processor.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy bitable sync (Cron) worker
        run: npx wrangler deploy --config workers/wrangler.bitable-sync.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy app worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
