name: E2E Tests (SmartFin v4)

# End-to-end tests with Playwright. Runs against the live worker (or a preview
# URL) and uploads the HTML report as an artifact for the reviewers.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aki-finance-dev
      - main

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          E2E_BASE_URL: "https://smartfin-v4.aki-wang.workers.dev"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
